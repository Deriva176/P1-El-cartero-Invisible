<!DOCTYPE html>
<html lang="ca">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>El Cartero Invisible</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- CAPÇALERA -->
    <header>
        <h1 id="titolPrincipal">📮 El Cartero Invisible – Setmana 2</h1>
    </header>


    <!-- CONTINGUT PRINCIPAL -->
    <main class="contenidorPrincipal">

        <!-- INFORMACIÓ DE BENVINGUDA -->
        <section class="info">
            <p>Benvingut al teu búzon virtual</p>
        </section>


        <!-- CONTENIDOR DE CARTES -->
        <section id="contenidorCartes">
            <p>Carregant cartes...</p>
        </section>


        <!-- BOTÓ PER SALUDAR -->
        <section class="contenidorBoton">
            <button id="btnSaluda" type="button">
                Saludar
            </button>
        </section>


        <!-- BÚSTIA VIRTUAL -->
        <div id="buzon">
            📬
        </div>


        <!-- AFegir CARTA DE PROVA -->
        <section class="contenidorBoton">
            <button id="btnAfegirCarta" type="button">
                Afegir carta de prova
            </button>
        </section>


        <!-- FORMULARI PER CREAR UNA CARTA -->
        <section id="seccioCrear">

            <h2>Crear una carta</h2>

            <form id="formCarta">

                <label for="remitent">Remitent:</label>
                <input
                    type="text"
                    id="remitent"
                    name="remitent"
                    required
                >

                <label for="destinatari">Destinatari:</label>
                <input
                    type="text"
                    id="destinatari"
                    name="destinatari"
                    required
                >

                <label for="contingut">Contingut:</label>
                <textarea
                    id="contingut"
                    name="contingut"
                    required
                ></textarea>

                <label for="personatge">Personatge:</label>
                <input
                    type="text"
                    id="personatge"
                    name="personatge"
                >

                <button type="submit">
                    Crear carta
                </button>

            </form>

        </section>


        <!-- BOTÓ PER MOSTRAR LA TAULA -->
        <section class="contenidorBoton">

            <button id="btnMostrarTaula" type="button">
                Mostrar taula
            </button>

        </section>


        <!-- TAULA DE CARTES -->
        <section id="seccioTaula" style="display: none;">

            <h2>Taula de cartes</h2>

            <table id="taulaCartes">

                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Remitent</th>
                        <th>Destinatari</th>
                        <th>Contingut</th>
                        <th>Personatge</th>
                        <th>Accions</th>
                    </tr>
                </thead>

                <tbody id="cosTaula">
                    <!-- Les files es generen amb JavaScript -->
                </tbody>

            </table>

        </section>

    </main>


    <!-- ========================================= -->
    <!-- FINESTRA MODAL PER EDITAR UNA CARTA       -->
    <!-- ========================================= -->

    <div
        id="modalEditar"
        class="modal"
        style="display: none;"
        role="dialog"
        aria-modal="true"
        aria-labelledby="titolModal"
    >

        <div class="modal-contingut">

            <!-- BOTÓ PER TANCAR LA FINESTRA -->
            <button
                type="button"
                id="btnTancarModal"
                class="tancar-modal"
                aria-label="Tancar finestra"
            >
                &times;
            </button>


            <h2 id="titolModal">
                Editar carta
            </h2>


            <!-- FORMULARI D'EDICIÓ -->
            <form id="formEditar">

                <!-- ID DE LA CARTA QUE S'ESTÀ EDITANT -->
                <input
                    type="hidden"
                    id="editarId"
                    name="id"
                >


                <!-- REMITENT -->
                <label for="editarRemitent">
                    Remitent:
                </label>

                <input
                    type="text"
                    id="editarRemitent"
                    name="remitent"
                    required
                >


                <!-- DESTINATARI -->
                <label for="editarDestinatari">
                    Destinatari:
                </label>

                <input
                    type="text"
                    id="editarDestinatari"
                    name="destinatari"
                    required
                >


                <!-- CONTINGUT -->
                <label for="editarContingut">
                    Contingut:
                </label>

                <textarea
                    id="editarContingut"
                    name="contingut"
                    required
                ></textarea>


                <!-- PERSONATGE -->
                <label for="editarPersonatge">
                    Personatge:
                </label>

                <input
                    type="text"
                    id="editarPersonatge"
                    name="personatge"
                >


                <!-- BOTONS DEL MODAL -->
                <div class="modal-botons">

                    <button
                        type="submit"
                        id="btnDesarEdicio"
                    >
                        Desar canvis
                    </button>

                    <button
                        type="button"
                        id="btnCancelEditar"
                    >
                        Cancel·lar
                    </button>

                </div>

            </form>

        </div>

    </div>


    <!-- INDICADOR DE CÀRREGA -->
    <p
        id="indicadorCarrega"
        style="display: none;"
        role="status"
    >
        Carregant...
    </p>


    <!-- PEU DE PÀGINA -->
    <footer>
        <p>© El Cartero Invisible</p>
    </footer>


    <!-- JAVASCRIPT -->
    <script type="module" src="script.js"></script>

</body>

</html>
